site_name: Smart Duration Field
site_description: Enter, display, and search Jira durations naturally.
site_url: https://tmsm-apps.github.io/docs/
repo_url: https://github.com/tmsm-apps/docs

theme:
  name: material
  language: en
  palette:
    primary: teal
    accent: amber
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - JQL reference: jql.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true