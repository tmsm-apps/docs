site_name: TMSM Jira Apps
site_description: Documentation for TMSM Jira Cloud apps.
site_url: https://tmsm-apps.github.io/docs/
repo_url: https://github.com/tmsm-apps/docs

theme:
  name: material
  language: en
  palette:
    primary: teal
    accent: amber
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Smart Duration Field:
      - Getting started: getting-started.md
      - Global settings: settings.md
      - Smart Duration Total: total-estimate.md
      - JQL reference: jql.md
  - FieldWas:
      - Overview: fieldwas/index.md
      - Getting started: fieldwas/getting-started.md
      - JQL reference: fieldwas/jql.md
      - Supported field types: fieldwas/field-types.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
